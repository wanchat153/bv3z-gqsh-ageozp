name: render
on:
  workflow_dispatch:
    inputs:
      seconds: { description: 'video length in seconds', default: '6.4' }
      parts: { description: 'number of parallel jobs (max 256)', default: '20' }
      fps: { description: 'frames per second', default: '60' }
      width: { description: 'frame width (1920 for landscape)', default: '1080' }
      height: { description: 'frame height (1080 for landscape)', default: '1920' }
      wx: { description: 'watermark x, or none for no watermark', default: '380' }
      wy: { description: 'watermark y', default: '480' }
      episode_dir: { description: 'episode folder with studio.html and the audio file', default: 'episode' }
      audio: { description: 'audio file name inside the episode folder', default: 'audio.flac' }
      fmt: { description: 'frame format png or jpg (jpg is much faster for big frames)', default: 'png' }
      preset: { description: 'x264 preset for the parts', default: 'veryfast' }
      crf: { description: 'x264 crf for the parts', default: '10' }
      fast_finish: { description: 'true = stream-copy join of the parts (parts must already be final quality, no watermark)', default: 'false' }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      frames: ${{ steps.m.outputs.frames }}
    steps:
      - id: m
        run: |
          NF=$(python3 -c "print(round(${{ inputs.seconds }}*${{ inputs.fps }}))")
          N=${{ inputs.parts }}
          echo "frames=$NF" >> $GITHUB_OUTPUT
          python3 - <<PY >> $GITHUB_OUTPUT
          import json
          nf=$NF; n=min($N,nf)
          m=[{"i":i,"s":nf*i//n,"e":nf*(i+1)//n} for i in range(n)]
          print("matrix="+json.dumps({"include":m}))
          PY
  render:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-thai-tlwg fonts-noto-core
      - run: node tools/render_part.mjs ${{ inputs.episode_dir }} ${{ matrix.s }} ${{ matrix.e }} out/part_${{ matrix.i }}
        env: { WORKERS: 4, FPS: '${{ inputs.fps }}', WIDTH: '${{ inputs.width }}', HEIGHT: '${{ inputs.height }}', CHROME: /usr/bin/google-chrome, FMT: '${{ inputs.fmt }}', PRESET: '${{ inputs.preset }}', CRF: '${{ inputs.crf }}' }
      - run: mv out/part_${{ matrix.i }}/part.mp4 out/part.mp4
      - uses: actions/upload-artifact@v4
        with: { name: 'part-${{ matrix.i }}', path: out/part.mp4, retention-days: 1, compression-level: 0 }
  finish:
    needs: [plan, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: 'part-*' }
      - run: |
          # sort parts numerically: rename part-N -> part-000N
          for d in parts/part-*; do n=${d##*-}; mv "$d" "parts/p$(printf %04d $n)"; done
          if [ "${{ inputs.fast_finish }}" = "true" ]; then bash tools/finish_fast.sh parts ${{ inputs.episode_dir }}/${{ inputs.audio }} out.mp4 ${{ inputs.seconds }}; else bash tools/finish.sh parts ${{ inputs.episode_dir }}/${{ inputs.audio }} out.mp4 ${{ inputs.wx }} ${{ inputs.wy }} ${{ inputs.seconds }}; fi
      - uses: actions/upload-artifact@v4
        with: { name: video, path: out.mp4, retention-days: 14 }
