name: bbn-voices
# Thai voice samples (edge-tts) for choosing a narrator; mp3s are pushed to the `voices` branch.
on:
  workflow_dispatch:
    inputs:
      text: { description: 'sample narration', default: 'ห้องเซิร์ฟเวอร์ คือหัวใจของโลกออนไลน์ เครื่องนับพันทำงานตลอดยี่สิบสี่ชั่วโมง' }
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    env:
      TEXT: ${{ inputs.text }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --break-system-packages edge-tts
      - name: generate samples (3 tries each, report sizes + errors)
        run: |
          mkdir -p out; : > out/report.txt
          gen() { # name voice rate pitch
            local n=$1 v=$2 r=$3 p=$4 try
            for try in 1 2 3; do
              args=(--voice "$v" --text "$TEXT" --write-media "out/$n.mp3")
              [ -n "$r" ] && args+=(--rate="$r"); [ -n "$p" ] && args+=(--pitch="$p")
              python3 -m edge_tts "${args[@]}" 2> out/err.txt && [ -s "out/$n.mp3" ] && { echo "$n OK try=$try size=$(stat -c%s out/$n.mp3)" >> out/report.txt; return; }
              rm -f "out/$n.mp3"
            done
            echo "$n FAILED err=$(tail -c 200 out/err.txt | tr '\n' ' ')" >> out/report.txt
          }
          for v in th-TH-NiwatNeural th-TH-PremwadeeNeural; do
            s=${v#th-TH-}; s=${s%Neural}
            gen "${s}_default" $v "" ""
            gen "${s}_doc" $v "-8%" "+0Hz"
            gen "${s}_calm" $v "-12%" "-6Hz"
            gen "${s}_rateonly" $v "-8%" ""
            gen "${s}_pitchonly" $v "" "-6Hz"
          done
          rm -f out/err.txt; cat out/report.txt
          echo "::notice title=voice report::$(tr '\n' ' ' < out/report.txt)"
      - name: push samples to voices branch
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git checkout -q --orphan voices
          git rm -rq --cached . > /dev/null 2>&1 || true
          git add -f out
          git commit -q -m "voice samples"
          git push -q -f origin voices
