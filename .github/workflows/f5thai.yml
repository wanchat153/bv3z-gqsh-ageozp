name: f5thai
# Thai narration with F5-TTS-THAI on CPU. Reference clips are made with edge-tts (male voice); mp3s are pushed to the `voices-f5` branch.
on:
  workflow_dispatch:
    inputs:
      text: { description: 'narration text', default: 'ยามค่ำคืนที่ฝนโปรยปราย ซามูไรหยดหมึกนั่งอยู่ข้างเตาอุ่นๆ ข้างกายมีแมวส้มชื่อโมจิหมอบหลับตาพริ้ม เสียงหยดน้ำฝนบนหลังคา ค่อยๆ กลายเป็นจังหวะเพลงที่แสนอบอุ่น' }
      speed: { description: 'speed (0.7-1.1)', default: '0.9' }
permissions:
  contents: write
jobs:
  f5:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEN_TEXT: ${{ inputs.text }}
      SPEED: ${{ inputs.speed }}
      REF_TEXT: สวัสดีครับ วันนี้ผมมีเรื่องสนุกๆ มาเล่าให้ฟังกันครับ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1 > /dev/null
          mkdir -p out; : > out/report.txt
          ( pip install --quiet torch==2.4.0 torchaudio==2.4.0 --index-url https://download.pytorch.org/whl/cpu \
            && pip install --quiet f5-tts-th edge-tts soundfile ) > out/pip.log 2>&1 \
            || echo "PIP FAILED: $(tail -c 600 out/pip.log | tr '\n' ' ')" >> out/report.txt
      - name: reference clips (male, edge-tts)
        run: |
          python -m edge_tts --voice th-TH-NiwatNeural --text "$REF_TEXT" --write-media out/ref_src.mp3
          ffmpeg -v error -y -i out/ref_src.mp3 -ar 24000 -ac 1 out/ref_plain.wav
          ffmpeg -v error -y -i out/ref_src.mp3 -af "rubberband=pitch=1.04,highpass=f=70,equalizer=f=2800:t=q:w=1.2:g=2.5,equalizer=f=6000:t=h:w=0.7:g=3,loudnorm=I=-18:TP=-1.5" -ar 24000 -ac 1 out/ref_bright.wav
          for f in out/ref_plain.wav out/ref_bright.wav; do echo "$f $(ffprobe -v error -show_entries format=duration -of csv=p=0 $f)s" >> out/report.txt; done
      - name: synthesise
        run: |
          python -c "import torch,torchaudio;print('torch',torch.__version__,'torchaudio',torchaudio.__version__)" >> out/report.txt 2>&1 || true
          S=$(date +%s)
          python tts/f5thai.py > out/run.log 2>&1 || echo "RUN FAILED" >> out/report.txt
          echo "run $(( $(date +%s) - S ))s: $(grep -E '^(OK|FAILED)' out/run.log | tr '\n' ' ')" >> out/report.txt
          grep -iE 'error|traceback' out/run.log | tail -5 >> out/report.txt || true
          for f in out/f5_*.wav; do [ -f "$f" ] && ffmpeg -v error -y -i "$f" -ar 44100 -ac 1 -b:a 192k "${f%.wav}.mp3" && echo "$(basename $f .wav) $(ffprobe -v error -show_entries format=duration -of csv=p=0 ${f%.wav}.mp3)s" >> out/report.txt; done
          mkdir -p keep; cp out/*.mp3 out/report.txt keep/ 2>/dev/null || true
          cat out/report.txt
          echo "::notice title=f5 report::$(tr '\n' '|' < out/report.txt | cut -c1-1500)"
      - name: push results
        if: always()
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git checkout -q --orphan voices-f5
          git rm -rq --cached . > /dev/null 2>&1 || true
          rm -rf out; mv keep out 2>/dev/null || mkdir -p out
          git add -f out
          git commit -q -m "f5thai samples"
          git push -q -f origin voices-f5
