<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="data.js"></script>
<script>
// Resonance Sweep: 10 balls on springs, shaker frequency sweeps up; each ball peaks at its own natural frequency. Frame = pure function of t. R=25 constant. 30 fps, 6-sample motion blur.
const W=1080,H=1920,TAU=Math.PI*2,cv=document.getElementById('c'),c=cv.getContext('2d');
const D=DATA,R=D.r,HZ=D.hz,FR=[D.x0,D.y0,D.x1-D.x0,D.y1-D.y0,40];const HUE=k=>(190+k*17)%360;
const TH={a:'#2c1a12',b:'#0c0604',g:'200,120,70',d:'255,205,170'};   // mocha theme
function sr(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function sm(u){u=Math.max(0,Math.min(1,u));return u*u*(3-2*u)}
const framePath=()=>{c.beginPath();c.roundRect(FR[0],FR[1],FR[2],FR[3],FR[4])};
function bg(){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,TH.a);g.addColorStop(1,TH.b);c.fillStyle=g;c.fillRect(0,0,W,H);
 const r=c.createRadialGradient(540,960,60,540,960,900);r.addColorStop(0,`rgba(${TH.g},.20)`);r.addColorStop(1,`rgba(${TH.g},0)`);c.fillStyle=r;c.fillRect(0,0,W,H);
 c.save();c.beginPath();c.rect(0,0,W,H);c.roundRect(FR[0]-2,FR[1]-2,FR[2]+4,FR[3]+4,FR[4]);c.clip('evenodd');
 c.strokeStyle=`rgba(${TH.d},.12)`;c.lineWidth=2;for(let x=-1200;x<2400;x+=120){c.beginPath();c.moveTo(x,0);c.lineTo(x+1536,1536);c.stroke();c.beginPath();c.moveTo(x+1536,0);c.lineTo(x,1536);c.stroke()}
 const rr=sr(61);for(let k=0;k<70;k++){const x=rr()*W,y=rr()*1536,z=.9+rr()*2.2;c.fillStyle=`rgba(${TH.d},${.4+rr()*.5})`;c.beginPath();c.arc(x,y,z,0,TAU);c.fill()}
 c.restore();c.save();framePath();c.fillStyle='rgba(2,2,8,.6)';c.fill();c.restore()}
function sphere(x,y,h,a){c.save();c.globalAlpha=a;
 const sg=c.createRadialGradient(x-R*.36,y-R*.42,R*.05,x-R*.08,y-R*.1,R*1.1);sg.addColorStop(0,`hsl(${h},65%,90%)`);sg.addColorStop(.3,`hsl(${h},70%,66%)`);sg.addColorStop(.72,`hsl(${h},64%,40%)`);sg.addColorStop(1,`hsl(${h},60%,22%)`);
 c.fillStyle=sg;c.beginPath();c.arc(x,y,R,0,TAU);c.fill();
 c.save();c.beginPath();c.arc(x,y,R,0,TAU);c.clip();const bl=c.createRadialGradient(x+R*.42,y+R*.5,0,x+R*.42,y+R*.5,R*.85);bl.addColorStop(0,`hsla(${(h+25)%360},90%,72%,.55)`);bl.addColorStop(1,`hsla(${(h+25)%360},90%,72%,0)`);c.fillStyle=bl;c.fillRect(x-R,y-R,2*R,2*R);c.restore();
 c.strokeStyle=`hsla(${h},55%,14%,.8)`;c.lineWidth=R*.09;c.beginPath();c.arc(x,y,R-.3,0,TAU);c.stroke();
 const hg=c.createRadialGradient(x-R*.4,y-R*.46,0,x-R*.4,y-R*.46,R*.42);hg.addColorStop(0,'rgba(255,255,255,.98)');hg.addColorStop(.5,'rgba(255,255,255,.45)');hg.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=hg;c.beginPath();c.arc(x-R*.4,y-R*.46,R*.42,0,TAU);c.fill();c.restore()}
function trail(pts,h,a){c.save();c.globalCompositeOperation='lighter';c.lineCap='butt';const n=pts.length-1;
 for(let layer=0;layer<2;layer++)for(let k=1;k<=n;k++){const u=k/n,f=Math.pow(1-u,1.1),hh=(h+u*50)%360;
  c.strokeStyle=layer?`hsla(${hh},90%,88%,${.5*f*a})`:`hsla(${hh},88%,62%,${.55*f*a})`;c.lineWidth=Math.max(1,2*R*(layer?.5:1.25)*f);c.beginPath();c.moveTo(pts[k-1][0],pts[k-1][1]);c.lineTo(pts[k][0],pts[k][1]);c.stroke()}
 c.restore()}
function S(a,t){const f=Math.max(0,Math.min(a.length-1.001,t*HZ)),k=Math.floor(f),u=f-k;return a[k]+(a[k+1]-a[k])*u}
function spring(x,y0,y1,w){const n=14,amp=15;c.beginPath();c.moveTo(x,y0);for(let i=1;i<n;i++){const y=y0+(y1-y0)*i/n;c.lineTo(x+(i%2?amp:-amp),y)}c.lineTo(x,y1);c.stroke()}
function render(t){
 bg();
 c.save();c.shadowColor='rgba(255,255,255,.95)';c.shadowBlur=36;c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=11;framePath();c.stroke();c.shadowBlur=12;c.strokeStyle='#fff';c.lineWidth=4.5;framePath();c.stroke();c.restore();
 const tt=window.TT!==undefined?window.TT:t,u=S(D.pl,t),hz=S(D.hzs,tt),py=D.plate+u;
 // shaker plate
 c.save();const g=c.createLinearGradient(0,py-14,0,py+14);g.addColorStop(0,'#f3e9df');g.addColorStop(1,'#8a7566');c.fillStyle=g;c.strokeStyle='rgba(15,8,4,.85)';c.lineWidth=4;c.shadowColor='rgba(255,230,200,.5)';c.shadowBlur=16;c.beginPath();c.roundRect(D.x0+30,py-14,D.x1-D.x0-60,28,12);c.fill();c.stroke();c.restore();
 for(let k=0;k<D.nb;k++){const x=D.colx[k],by=D.rest+S(D.pos[k],t),h=HUE(k);
  c.save();c.strokeStyle=`hsla(${h},35%,80%,.85)`;c.lineWidth=4;c.lineJoin='round';spring(x,py+14,by-R,0);c.restore();
  const pts=[];for(let q=0;q<=14;q++)pts.push([x,D.rest+S(D.pos[k],Math.max(0,t-q*.0085))]);trail(pts,h,.85);sphere(x,by,h,1);
  // natural-frequency label, brighter when the shaker is close
  const close=Math.max(0,1-Math.abs(hz-D.f[k])/.35);c.save();c.font='800 30px system-ui,sans-serif';c.textAlign='center';c.fillStyle=`hsla(${h},80%,${68+20*close}%,${.55+.45*close})`;c.fillText(D.f[k].toFixed(1),x,1465);c.restore()}
 c.save();c.font='700 28px system-ui,sans-serif';c.textAlign='center';c.fillStyle='rgba(255,255,255,.6)';c.fillText('natural frequency (Hz)',540,1500);c.restore();
 let cap='Which ball will shake the most?';if(tt>=4&&tt<D.ts)cap='Each ball has its own favourite beat.';if(tt>=D.ts)cap='Match the beat = resonance.';
 c.save();c.textAlign='center';c.textBaseline='middle';c.fillStyle='rgba(255,255,255,.98)';c.shadowColor='rgba(0,0,0,.6)';c.shadowBlur=8;
 c.font='800 84px system-ui,sans-serif';c.fillText('Shaker: '+hz.toFixed(2)+' Hz',540,95);c.font='700 44px system-ui,sans-serif';c.fillText(cap,540,178);c.restore()}
window.render=render;
const FPSV=+(new URLSearchParams(location.search).get('fps')||30),K=6,SHUT=.75;
const acc=document.createElement('canvas');acc.width=W;acc.height=H;const ac=acc.getContext('2d');
function blurFrame(t){window.TT=t;for(let j=0;j<K;j++){render(Math.max(0,t-SHUT/FPSV*(j/(K-1))));ac.globalAlpha=1/(j+1);ac.drawImage(cv,0,0)}ac.globalAlpha=1;c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c.drawImage(acc,0,0)}
window.grabPNG=t=>{blurFrame(t);return cv.toDataURL('image/png').split(',')[1]};
window.grab=t=>{blurFrame(t);return cv.toDataURL('image/jpeg',.92).split(',')[1]};
window.DUR=D.dur;window.READY=true;
</script></body></html>
