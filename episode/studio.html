<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="data.js"></script>
<script>
// Survival Rain: one ball hops and dodges falling spikes (auto-pilot AI); each death leaves a ghost that blocks spikes; 5 lives. Frame = pure function of t. R=25 constant. 30 fps, 6-sample motion blur.
const W=1080,H=1920,TAU=Math.PI*2,cv=document.getElementById('c'),c=cv.getContext('2d');
const D=DATA,R=D.r,HZ=D.hz,SW=D.sw,SH=D.sh,FR=[D.x0,D.y0,D.x1-D.x0,D.y1-D.y0,40],LH=[190,45,330,120,270],FLOOR=D.y1-R;
const TH={a:'#2a1424',b:'#0d0510',g:'200,80,130',d:'255,190,210'};   // rose dusk theme
function sr(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function sm(u){u=Math.max(0,Math.min(1,u));return u*u*(3-2*u)}
const framePath=()=>{c.beginPath();c.roundRect(FR[0],FR[1],FR[2],FR[3],FR[4])};
function bg(){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,TH.a);g.addColorStop(1,TH.b);c.fillStyle=g;c.fillRect(0,0,W,H);
 const r=c.createRadialGradient(540,960,60,540,960,900);r.addColorStop(0,`rgba(${TH.g},.20)`);r.addColorStop(1,`rgba(${TH.g},0)`);c.fillStyle=r;c.fillRect(0,0,W,H);
 c.save();c.beginPath();c.rect(0,0,W,H);c.roundRect(FR[0]-2,FR[1]-2,FR[2]+4,FR[3]+4,FR[4]);c.clip('evenodd');
 c.strokeStyle=`rgba(${TH.d},.14)`;c.lineWidth=2.5;for(let k=0;k<8;k++){c.beginPath();c.arc(540,960,420+k*140,0,TAU);c.stroke()}
 c.strokeStyle=`rgba(${TH.d},.09)`;c.lineWidth=1.5;for(let x=0;x<=W;x+=90){c.beginPath();c.moveTo(x,0);c.lineTo(x,1536);c.stroke()}for(let y=0;y<=1536;y+=90){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
 const rr=sr(83);for(let k=0;k<80;k++){const x=rr()*W,y=rr()*1536,z=.9+rr()*2.2;c.fillStyle=`rgba(${TH.d},${.4+rr()*.5})`;c.beginPath();c.arc(x,y,z,0,TAU);c.fill()}
 c.restore();c.save();framePath();c.fillStyle='rgba(2,2,8,.6)';c.fill();c.restore()}
function ghostBall(x,y,h,a){c.save();c.globalAlpha=a;const g=c.createRadialGradient(x-8,y-9,2,x,y,R);g.addColorStop(0,'rgba(210,210,225,.55)');g.addColorStop(1,'rgba(120,120,150,.28)');c.fillStyle=g;c.beginPath();c.arc(x,y,R,0,TAU);c.fill();c.strokeStyle=`hsla(${h},60%,70%,.55)`;c.lineWidth=3;c.beginPath();c.arc(x,y,R-1.5,0,TAU);c.stroke();c.restore()}
function spike(x,yt,a){c.save();c.globalAlpha=a;const g=c.createLinearGradient(0,yt,0,yt+SH);g.addColorStop(0,'rgba(245,235,245,.95)');g.addColorStop(1,'rgba(255,170,190,.95)');c.shadowColor='rgba(255,150,180,.8)';c.shadowBlur=14;c.fillStyle=g;c.beginPath();c.moveTo(x-SW,yt);c.lineTo(x+SW,yt);c.lineTo(x,yt+SH);c.closePath();c.fill();c.restore()}
function sphere(x,y,h,a){c.save();c.globalAlpha=a;
 const sg=c.createRadialGradient(x-R*.36,y-R*.42,R*.05,x-R*.08,y-R*.1,R*1.1);sg.addColorStop(0,`hsl(${h},65%,90%)`);sg.addColorStop(.3,`hsl(${h},70%,66%)`);sg.addColorStop(.72,`hsl(${h},64%,40%)`);sg.addColorStop(1,`hsl(${h},60%,22%)`);
 c.fillStyle=sg;c.beginPath();c.arc(x,y,R,0,TAU);c.fill();
 c.save();c.beginPath();c.arc(x,y,R,0,TAU);c.clip();const bl=c.createRadialGradient(x+R*.42,y+R*.5,0,x+R*.42,y+R*.5,R*.85);bl.addColorStop(0,`hsla(${(h+25)%360},90%,72%,.55)`);bl.addColorStop(1,`hsla(${(h+25)%360},90%,72%,0)`);c.fillStyle=bl;c.fillRect(x-R,y-R,2*R,2*R);c.restore();
 c.strokeStyle=`hsla(${h},55%,14%,.8)`;c.lineWidth=R*.09;c.beginPath();c.arc(x,y,R-.3,0,TAU);c.stroke();
 const hg=c.createRadialGradient(x-R*.4,y-R*.46,0,x-R*.4,y-R*.46,R*.42);hg.addColorStop(0,'rgba(255,255,255,.98)');hg.addColorStop(.5,'rgba(255,255,255,.45)');hg.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=hg;c.beginPath();c.arc(x-R*.4,y-R*.46,R*.42,0,TAU);c.fill();c.restore()}
function trail(pts,h,a){c.save();c.globalCompositeOperation='lighter';c.lineCap='butt';const n=pts.length-1;
 for(let layer=0;layer<2;layer++)for(let k=1;k<=n;k++){const u=k/n,f=Math.pow(1-u,1.1),hh=(h+u*50)%360;
  c.strokeStyle=layer?`hsla(${hh},90%,88%,${.5*f*a})`:`hsla(${hh},88%,62%,${.55*f*a})`;c.lineWidth=Math.max(1,2*R*(layer?.5:1.25)*f);c.beginPath();c.moveTo(pts[k-1][0],pts[k-1][1]);c.lineTo(pts[k][0],pts[k][1]);c.stroke()}
 c.restore()}




function level(t){return 1+Math.floor(t/D.levt)}
function ballPos(L,t){const P=L.p,n=P.length/2-1,f=Math.max(0,Math.min(n-.001,(t-L.t0)*HZ)),k=Math.floor(f),u=f-k;return[P[2*k]+(P[2*k+2]-P[2*k])*u,P[2*k+1]+(P[2*k+3]-P[2*k+1])*u]}
function render(t){
 bg();
 c.save();c.shadowColor='rgba(255,255,255,.95)';c.shadowBlur=36;c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=11;framePath();c.stroke();c.shadowBlur=12;c.strokeStyle='#fff';c.lineWidth=4.5;framePath();c.stroke();c.restore();
 c.save();framePath();c.clip();
 // ghosts
 D.ghosts.forEach((g,i)=>{if(t<g.t)return;const u=Math.min(1,(t-g.t)/.38),y=g.y0+(g.y1-g.y0)*u*u;ghostBall(g.x,y,LH[i],1)});
 // spikes
 for(const s of D.spk){if(t<s.ts)continue;const e=s.end===null?1e9:s.end;if(t>e+.001)continue;const yt=D.y0-SH+s.v*(t-s.ts);spike(s.x,yt,1)}
 // active ball
 let active=-1;D.lives.forEach((L,i)=>{if(t>=L.t0&&t<L.t1)active=i});
 if(active>=0){const L=D.lives[active],p=ballPos(L,t),inv=(t-L.t0)<D.inv;const pts=[];for(let q=0;q<=14;q++)pts.push(ballPos(L,Math.max(L.t0,t-q*.0085)));
  const sp=Math.hypot(pts[0][0]-pts[4][0],pts[0][1]-pts[4][1])/.034,a=Math.min(1,sp/200);if(a>.05)trail(pts,L.h,a*.8);
  c.save();c.globalAlpha=inv?(.55+.2*Math.sin((t-L.t0)*14)):1;sphere(p[0],p[1],L.h,1);c.restore();
  if(inv){c.save();c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=3;c.beginPath();c.arc(p[0],p[1],R+8,0,TAU);c.stroke();c.restore()}}
 c.restore();
 // lives row
 let deaths=0;D.lives.forEach(L=>{if(t>=L.t1)deaths++});
 for(let i=0;i<D.nl;i++){const x=540+(i-2)*46,y=252;c.save();if(i<deaths){c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=3;c.beginPath();c.arc(x,y,11,0,TAU);c.stroke()}else{c.fillStyle=`hsl(${LH[i]},65%,60%)`;c.beginPath();c.arc(x,y,11,0,TAU);c.fill()}c.restore()}
 // text
 const end=t>=D.tend;let top,cap;
 if(end){top='Game over';cap='Level '+level(D.tend)+'. Five ghosts remain.'}
 else{const L=level(t);top='Level '+L;const life=Math.min(D.nl,deaths+1);cap=deaths===0?'Dodge the falling spikes.':(deaths===1?'One ghost now blocks the rain.':'Life '+life+' of '+D.nl+'. Ghosts block spikes.')}
 c.save();c.textAlign='center';c.textBaseline='middle';c.fillStyle='rgba(255,255,255,.98)';c.shadowColor='rgba(0,0,0,.6)';c.shadowBlur=8;
 c.font='800 84px system-ui,sans-serif';c.fillText(top,540,95);c.font='700 44px system-ui,sans-serif';c.fillText(cap,540,178);c.restore()}
window.render=render;
const FPSV=+(new URLSearchParams(location.search).get('fps')||30),K=6,SHUT=.75;
const acc=document.createElement('canvas');acc.width=W;acc.height=H;const ac=acc.getContext('2d');
function blurFrame(t){for(let j=0;j<K;j++){render(Math.max(0,t-SHUT/FPSV*(j/(K-1))));ac.globalAlpha=1/(j+1);ac.drawImage(cv,0,0)}ac.globalAlpha=1;c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c.drawImage(acc,0,0)}
window.grabPNG=t=>{blurFrame(t);return cv.toDataURL('image/png').split(',')[1]};
window.grab=t=>{blurFrame(t);return cv.toDataURL('image/jpeg',.92).split(',')[1]};
window.DUR=D.dur;window.READY=true;
</script></body></html>
