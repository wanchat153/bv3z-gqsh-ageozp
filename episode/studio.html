<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="data.js"></script>
<script>
// Hex Kaleidoscope: one ball in a rotating hexagon; its path (in the hexagon's frame) is mirrored 6x2 into a flower. Frame = pure function of t. R=25.
const W=1080,H=1920,TAU=Math.PI*2,cv=document.getElementById('c'),c=cv.getContext('2d');
const D=DATA,R=D.r,CX=D.cx,CY=D.cy,RH=D.RH,OM=D.W,SAMP=D.samp,P=D.p,FR=[D.x0,D.y0,D.x1-D.x0,D.y1-D.y0,40];
const TH={a:'#0e1830',b:'#04060f',g:'90,140,255',d:'170,200,255'};   // midnight-blue theme
function sr(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function sm(u){u=Math.max(0,Math.min(1,u));return u*u*(3-2*u)}
const framePath=()=>{c.beginPath();c.roundRect(FR[0],FR[1],FR[2],FR[3],FR[4])};
function bg(){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,TH.a);g.addColorStop(1,TH.b);c.fillStyle=g;c.fillRect(0,0,W,H);
 const r=c.createRadialGradient(540,960,60,540,960,900);r.addColorStop(0,`rgba(${TH.g},.20)`);r.addColorStop(1,`rgba(${TH.g},0)`);c.fillStyle=r;c.fillRect(0,0,W,H);
 c.save();c.beginPath();c.rect(0,0,W,H);c.roundRect(FR[0]-2,FR[1]-2,FR[2]+4,FR[3]+4,FR[4]);c.clip('evenodd');
 c.strokeStyle=`rgba(${TH.d},.14)`;c.lineWidth=2.5;for(let k=0;k<8;k++){c.beginPath();c.arc(540,960,420+k*140,0,TAU);c.stroke()}
 c.strokeStyle=`rgba(${TH.d},.09)`;c.lineWidth=1.5;for(let x=0;x<=W;x+=90){c.beginPath();c.moveTo(x,0);c.lineTo(x,1536);c.stroke()}for(let y=0;y<=1536;y+=90){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
 const rr=sr(83);for(let k=0;k<80;k++){const x=rr()*W,y=rr()*1536,z=.9+rr()*2.2;c.fillStyle=`rgba(${TH.d},${.4+rr()*.5})`;c.beginPath();c.arc(x,y,z,0,TAU);c.fill()}
 c.restore()}
function sphere(x,y,h,a){c.save();c.globalAlpha=a;
 const sg=c.createRadialGradient(x-R*.36,y-R*.42,R*.05,x-R*.08,y-R*.1,R*1.1);sg.addColorStop(0,`hsl(${h},65%,90%)`);sg.addColorStop(.3,`hsl(${h},70%,66%)`);sg.addColorStop(.72,`hsl(${h},64%,40%)`);sg.addColorStop(1,`hsl(${h},60%,22%)`);
 c.fillStyle=sg;c.beginPath();c.arc(x,y,R,0,TAU);c.fill();
 c.save();c.beginPath();c.arc(x,y,R,0,TAU);c.clip();const bl=c.createRadialGradient(x+R*.42,y+R*.5,0,x+R*.42,y+R*.5,R*.85);bl.addColorStop(0,`hsla(${(h+25)%360},90%,72%,.55)`);bl.addColorStop(1,`hsla(${(h+25)%360},90%,72%,0)`);c.fillStyle=bl;c.fillRect(x-R,y-R,2*R,2*R);c.restore();
 c.strokeStyle=`hsla(${h},55%,14%,.8)`;c.lineWidth=R*.09;c.beginPath();c.arc(x,y,R-.3,0,TAU);c.stroke();
 const hg=c.createRadialGradient(x-R*.4,y-R*.46,0,x-R*.4,y-R*.46,R*.42);hg.addColorStop(0,'rgba(255,255,255,.98)');hg.addColorStop(.5,'rgba(255,255,255,.45)');hg.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=hg;c.beginPath();c.arc(x-R*.4,y-R*.46,R*.42,0,TAU);c.fill();c.restore()}
function trail(pts,h,a){c.save();c.globalCompositeOperation='lighter';c.lineCap='butt';const n=pts.length-1;
 for(let layer=0;layer<2;layer++)for(let k=1;k<=n;k++){const u=k/n,f=Math.pow(1-u,1.1),hh=(h+u*50)%360;
  c.strokeStyle=layer?`hsla(${hh},90%,88%,${.5*f*a})`:`hsla(${hh},88%,62%,${.55*f*a})`;c.lineWidth=Math.max(1,2*R*(layer?.5:1.25)*f);c.beginPath();c.moveTo(pts[k-1][0],pts[k-1][1]);c.lineTo(pts[k][0],pts[k][1]);c.stroke()}
 c.restore()}





function phiAt(t){const f=Math.max(0,Math.min(D.phi.length-1.001,t*SAMP)),k=Math.floor(f),u=f-k;return D.phi[k]+(D.phi[k+1]-D.phi[k])*u}
function hexp(t){const f=Math.max(0,Math.min(P.length-1.001,t*SAMP)),k=Math.floor(f),u=f-k;return[P[k][0]+(P[k+1][0]-P[k][0])*u,P[k][1]+(P[k+1][1]-P[k][1])*u]}
function render(t){
 bg();

 const ph=phiAt(t),cur=Math.min(P.length-1,Math.floor(t*SAMP));
 // mirrored pattern
 c.save();c.translate(CX,CY);c.globalCompositeOperation='source-over';c.lineCap='round';c.lineJoin='round';
 const CH=24;
 for(let m=0;m<1;m++)for(let k=0;k<6;k++){c.save();c.rotate(ph+k*Math.PI/3);if(m)c.scale(1,-1);
  for(let s=0;s<cur;s+=CH){const e=Math.min(cur,s+CH),age=(t*SAMP-e)/SAMP,a=Math.max(.18,Math.min(1,1.05-age*.055)),h=(s*.35+200)%360;
   c.strokeStyle=`hsla(${h},95%,66%,${a})`;c.lineWidth=4.2;c.beginPath();c.moveTo(P[s][0],P[s][1]);for(let q=s+1;q<=e;q++)c.lineTo(P[q][0],P[q][1]);c.stroke()}
  c.restore()}
 c.restore();
 // rotating hexagon wall
 c.save();c.translate(CX,CY);c.rotate(ph);c.strokeStyle='rgba(235,240,255,.9)';c.lineWidth=7;c.shadowColor='rgba(150,190,255,.9)';c.shadowBlur=18;c.lineJoin='round';c.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3+Math.PI/6;i?c.lineTo(RH*Math.cos(a),RH*Math.sin(a)):c.moveTo(RH*Math.cos(a),RH*Math.sin(a))}c.closePath();c.stroke();c.restore();
 // the real ball + its comet tail (inertial frame)
 const pos=tt=>{const q=hexp(tt),a=phiAt(tt);return[CX+q[0]*Math.cos(a)-q[1]*Math.sin(a),CY+q[0]*Math.sin(a)+q[1]*Math.cos(a)]};
 const pts=[];for(let q=0;q<=40;q++)pts.push(pos(Math.max(0,t-q*.004)));const p=pos(t);
 trail(pts,40,.9);sphere(p[0],p[1],40,1)}
function drawText(t){const n=D.ev.filter(e=>e[0]<=t).length;
 c.save();c.textAlign='center';c.textBaseline='middle';c.fillStyle='rgba(255,255,255,.98)';c.shadowColor='rgba(0,0,0,.6)';c.shadowBlur=8;
 c.font='800 84px system-ui,sans-serif';c.fillText('Bounce '+n,540,95);c.font='700 44px system-ui,sans-serif';c.fillText(t<3?'One ball in a spinning hexagon.':'It keeps speeding up.',540,178);c.restore()}
window.render=render;
const FPSV=+(new URLSearchParams(location.search).get('fps')||60),K=6,SHUT=.75;
const acc=document.createElement('canvas');acc.width=W;acc.height=H;const ac=acc.getContext('2d');
function blurFrame(t){for(let j=0;j<K;j++){render(Math.max(0,t-SHUT/FPSV*(j/(K-1))));ac.globalAlpha=1/(j+1);ac.drawImage(cv,0,0)}ac.globalAlpha=1;c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c.drawImage(acc,0,0);drawText(t)}
window.grabPNG=t=>{blurFrame(t);return cv.toDataURL('image/png').split(',')[1]};
window.grab=t=>{blurFrame(t);return cv.toDataURL('image/jpeg',.92).split(',')[1]};
window.DUR=D.dur;window.READY=true;
</script></body></html>
