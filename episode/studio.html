<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="2560" height="1440"></canvas>
<script src="data.js"></script>
<script>
// Gentle photo-motion studio: still + very slow Ken Burns + soft crossfade + ~1% faint overlays. Frame = pure function of t. 2560x1440.
const W=2560,H=1440,TAU=Math.PI*2,cv=document.getElementById('c'),c=cv.getContext('2d',{alpha:false});
const SH=DATA.shots,DUR=DATA.dur;
const clamp=(u,a=0,b=1)=>Math.max(a,Math.min(b,u));
const sm=u=>{u=clamp(u);return u*u*(3-2*u)};
function rng(s){s=(s>>>0)||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const BM=new Map();
async function loadBM(n){if(BM.has(n))return BM.get(n);const im=new Image();im.src='img/'+SH[n].img;await im.decode();const b=await createImageBitmap(im);BM.set(n,b);return b}
function trim(keep){for(const [k,b] of BM)if(!keep.includes(k)){b.close();BM.delete(k)}}
function shotAt(t){let lo=0,hi=SH.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(SH[m].t0<=t)lo=m;else hi=m-1}return lo}
// no camera movement at all: the still stays perfectly steady
function cam(s,tl){return{z:1,cx:.5,cy:.5}}
function drawShot(s,tl,alpha){
  const bm=BM.get(s.n);if(!bm)return;const k=cam(s,tl);
  c.save();c.globalAlpha=alpha;c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
  const sw=bm.width/k.z,sh=bm.height/k.z,sx=k.cx*bm.width-sw/2,sy=k.cy*bm.height-sh/2;
  c.drawImage(bm,sx,sy,sw,sh,0,0,W,H);c.restore();
}
// ~1% faint touches: soft dust motes, a barely visible light sweep, very light vignette
const vig=document.createElement('canvas');vig.width=W;vig.height=H;{const g=vig.getContext('2d'),r=g.createRadialGradient(W/2,H*.48,H*.45,W/2,H*.5,H*1.05);r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(0,0,0,.35)');g.fillStyle=r;g.fillRect(0,0,W,H)}
function faint(s,t,tl){
  const r=rng(s.n*7919+13);
  c.save();c.globalCompositeOperation='lighter';
  for(let i=0;i<26;i++){const x0=r()*W,y0=r()*H,sp=8+r()*18,ph=r()*TAU,fx=.3+r()*.5,rad=(2+r()*5),al=.05+r()*.06;
    const x=x0+Math.sin(t*fx+ph)*30,y=((y0-t*sp*2)%H+H)%H;
    c.fillStyle=`rgba(255,244,214,${al})`;c.beginPath();c.arc(x,y,rad,0,TAU);c.fill()}
  c.restore();
  if(s.n%5===2){const d=Math.max(s.t1-s.t0,.8),u=clamp(tl/d),x=-W*.4+u*W*1.8;c.save();c.globalCompositeOperation='lighter';const g=c.createLinearGradient(x,0,x+W*.3,H*.4);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,250,235,.035)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,W,H);c.restore()}
  c.save();c.globalAlpha=.35;c.drawImage(vig,0,0);c.restore();
}
async function render(t){
  t=clamp(t,0,DUR-1/60);const i=shotAt(t),s=SH[i],tl=t-s.t0,d=s.t1-s.t0,XF=Math.min(.2,.3*d);
  const need=[i];if(i>0&&tl<XF)need.push(i-1);if(i+1<SH.length)need.push(i+1);
  await Promise.all(need.map(loadBM));trim(need);
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c.fillStyle='#000';c.fillRect(0,0,W,H);
  if(i>0&&tl<XF){const p=SH[i-1];drawShot(p,t-p.t0,1);drawShot(s,tl,sm(tl/XF))}else drawShot(s,tl,1);
  faint(s,t,tl);
  const f=Math.min(clamp(t/.4),clamp((DUR-t)/.8));if(f<1){c.save();c.fillStyle=`rgba(0,0,0,${1-f})`;c.fillRect(0,0,W,H);c.restore()}
}
window.render=render;
window.grab=async t=>{await render(t);return cv.toDataURL('image/jpeg',.94).split(',')[1]};
window.grabPNG=async t=>{await render(t);return cv.toDataURL('image/png').split(',')[1]};
window.DUR=DUR;window.READY=true;
</script></body></html>
