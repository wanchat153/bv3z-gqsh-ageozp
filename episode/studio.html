<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="data.js"></script>
<script>
// 5 slopes race (brachistochrone). Frame = pure function of t. Ball radius is CONSTANT (R=25).
const W=1080,H=1920,TAU=Math.PI*2,cv=document.getElementById('c'),c=cv.getContext('2d');
const R=25,HUES=DATA.hues,H_=DATA.heats,NS=5,SLOT_Y=1425,FR=[40,250,1000,1260];
const CAP_PRE=["Same start. Same finish. Which ball wins?","Taller drop. Same question.","Now the curve dips below the finish. Who wins?","Narrow and steep. Who wins this one?","Last heat. Who wins?"];
const CAP_POST=["The curve (cycloid) wins!","A curve beats the straight line.","It dips below the finish, still first.","Steep start = speed early.","Brachistochrone: the fastest slide."];
function bg(){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#14102a');g.addColorStop(1,'#07050f');c.fillStyle=g;c.fillRect(0,0,W,H);
 const r=c.createRadialGradient(540,860,60,540,860,900);r.addColorStop(0,'rgba(80,90,190,.20)');r.addColorStop(1,'rgba(80,90,190,0)');c.fillStyle=r;c.fillRect(0,0,W,H)}
function neon(path,w=8){c.save();c.shadowColor='rgba(255,255,255,.95)';c.shadowBlur=36;c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=w+3;path();c.stroke();c.shadowBlur=12;c.strokeStyle='#fff';c.lineWidth=w*.55;path();c.stroke();c.restore()}
function sphere(x,y,h,a){c.save();c.globalAlpha=a;
 const sg=c.createRadialGradient(x-R*.36,y-R*.42,R*.05,x-R*.08,y-R*.1,R*1.1);sg.addColorStop(0,`hsl(${h},65%,90%)`);sg.addColorStop(.3,`hsl(${h},70%,66%)`);sg.addColorStop(.72,`hsl(${h},64%,40%)`);sg.addColorStop(1,`hsl(${h},60%,22%)`);
 c.fillStyle=sg;c.beginPath();c.arc(x,y,R,0,TAU);c.fill();
 c.save();c.beginPath();c.arc(x,y,R,0,TAU);c.clip();const bl=c.createRadialGradient(x+R*.42,y+R*.5,0,x+R*.42,y+R*.5,R*.85);bl.addColorStop(0,`hsla(${(h+25)%360},90%,72%,.55)`);bl.addColorStop(1,`hsla(${(h+25)%360},90%,72%,0)`);c.fillStyle=bl;c.fillRect(x-R,y-R,2*R,2*R);c.restore();
 c.strokeStyle=`hsla(${h},55%,14%,.8)`;c.lineWidth=R*.09;c.beginPath();c.arc(x,y,R-.3,0,TAU);c.stroke();
 const hg=c.createRadialGradient(x-R*.4,y-R*.46,0,x-R*.4,y-R*.46,R*.42);hg.addColorStop(0,'rgba(255,255,255,.98)');hg.addColorStop(.5,'rgba(255,255,255,.45)');hg.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=hg;c.beginPath();c.arc(x-R*.4,y-R*.46,R*.42,0,TAU);c.fill();c.restore()}
function trail(pts,h,a){c.save();c.globalCompositeOperation='lighter';c.lineCap='butt';const n=pts.length-1;
 for(let layer=0;layer<2;layer++)for(let k=1;k<=n;k++){const u=k/n,f=Math.pow(1-u,1.1),hh=(h+u*50)%360;
  c.strokeStyle=layer?`hsla(${hh},90%,88%,${.55*f*a})`:`hsla(${hh},88%,62%,${.62*f*a})`;c.lineWidth=Math.max(1,2*R*(layer?.5:1.25)*f);c.beginPath();c.moveTo(pts[k-1][0],pts[k-1][1]);c.lineTo(pts[k][0],pts[k][1]);c.stroke()}
 c.restore()}
function ring(x,y,a){c.save();c.globalAlpha=a;c.strokeStyle='#fff';c.shadowColor='rgba(255,255,255,.9)';c.shadowBlur=14;c.lineWidth=4;c.beginPath();c.arc(x,y,R,0,TAU);c.stroke();c.restore()}
function sm(u){u=Math.max(0,Math.min(1,u));return u*u*(3-2*u)}
function curvePos(cu,tl){const tt=cu.tt,P=cu.P,N=tt.length-1;if(tl<=0)return[P[0],P[1]];if(tl>=tt[N])return[P[2*N],P[2*N+1]];
 let lo=0,hi=N;while(hi-lo>1){const m=(lo+hi)>>1;if(tt[m]<=tl)lo=m;else hi=m}
 const u=(tl-tt[lo])/(tt[hi]-tt[lo]);return[P[2*lo]+(P[2*hi]-P[2*lo])*u,P[2*lo+1]+(P[2*hi+1]-P[2*lo+1])*u]}
function slotX(rank){return 540+(rank-2)*92}
function ballPos(H1,i,lt){const tl=lt-H1.tr,f=H1.fin[i],cu=H1.curves[i];
 if(tl<f)return curvePos(cu,tl);
 const e=sm((tl-f)/.5),bx=H1.bx_,by=H1.by_;return[bx+(slotX(H1.rank[i])-bx)*e,by+(SLOT_Y-by)*e]}
function heatIndex(t){let k=0;for(let i=0;i<H_.length;i++)if(t>=H_[i].S)k=i;return k}
function render(t){
 bg();neon(()=>{c.beginPath();c.roundRect(FR[0],FR[1],FR[2],FR[3],48)},8);
 const hi=heatIndex(t),h=H_[hi],lt=t-h.S;h.bx_=h.mir?h.ax:h.bx;h.by_=h.by; // end ring x
 // endpoints: in gen, start A is at (ax,ay) for non-mirrored; paths already mirrored in data so use curve endpoints
 const c0=h.curves[0],N=c0.tt.length-1;const Ax=c0.P[0],Ay=c0.P[1],Bx=c0.P[2*N],By=c0.P[2*N+1];h.bx_=Bx;h.by_=By;
 let a=1;if(hi>0)a=Math.min(a,lt/.35);if(hi<H_.length-1)a=Math.min(a,(h.T-lt)/.35);a=sm(a);
 const prog=lt-h.tr;
 c.save();c.globalAlpha=a;
 // slot markers
 for(let r=0;r<NS;r++){c.fillStyle='rgba(255,255,255,.55)';c.font='700 30px system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(String(r+1),slotX(r),SLOT_Y+58);
  c.strokeStyle='rgba(255,255,255,.22)';c.lineWidth=3;c.beginPath();c.arc(slotX(r),SLOT_Y,R+3,0,TAU);c.stroke()}
 // ramps (thin) + travelled part lit
 for(let i=0;i<NS;i++){const cu=h.curves[i],tt=cu.tt,P=cu.P;c.strokeStyle='rgba(255,255,255,.26)';c.lineWidth=3;c.beginPath();for(let k=0;k<=N;k++)k?c.lineTo(P[2*k],P[2*k+1]):c.moveTo(P[2*k],P[2*k+1]);c.stroke();
  if(prog>0){c.save();c.globalCompositeOperation='lighter';c.strokeStyle=`hsla(${HUES[i]},80%,66%,.34)`;c.lineWidth=5;c.beginPath();let first=true;for(let k=0;k<=N&&tt[k]<=prog;k++){first?c.moveTo(P[2*k],P[2*k+1]):c.lineTo(P[2*k],P[2*k+1]);first=false}c.stroke();c.restore()}}
 ring(Ax,Ay,.95);ring(Bx,By,.95);
 // balls (draw slowest first so the winner is on top)
 const ord=[...Array(NS).keys()].sort((p,q)=>h.rank[q]-h.rank[p]);
 for(const i of ord){const pts=[];for(let q=0;q<=34;q++)pts.push(ballPos(h,i,Math.max(0,lt-q*.009)));
  trail(pts,HUES[i],1);}
 for(const i of ord){const p=ballPos(h,i,lt);sphere(p[0],p[1],HUES[i],1)}
 c.restore();
 // header (always visible)
 const won=prog>=Math.min(...h.fin);
 c.save();c.textAlign='center';c.textBaseline='middle';c.fillStyle='rgba(255,255,255,.96)';
 c.font='800 84px system-ui,sans-serif';c.fillText('Heat '+(hi+1)+' / '+H_.length,540,95);
 c.font='700 40px system-ui,sans-serif';c.globalAlpha=a<1&&lt<.35?sm(lt/.35):1;c.fillText(won?CAP_POST[hi]:CAP_PRE[hi],540,178);c.restore()}
window.render=render;
window.grabPNG=t=>{render(t);return cv.toDataURL('image/png').split(',')[1]};
window.grab=t=>{render(t);return cv.toDataURL('image/jpeg',.92).split(',')[1]};
window.DUR=DATA.dur;window.READY=true;
</script></body></html>
